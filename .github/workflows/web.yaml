name: web

on:
  push:
    branches: [master]
    paths: ['web/**', '.github/workflows/web.yaml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yaml']

# Least-privilege: this workflow only reads the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Node unit + parity tests
        run: npm test
      - name: Install Chromium for browser/e2e tests
        run: npx playwright install --with-deps chromium
      - name: Browser-mode tests (real Chromium)
        run: npm run test:browser
      - name: End-to-end tests (built preview)
        run: npm run test:e2e
      - name: Production build
        run: npm run build
