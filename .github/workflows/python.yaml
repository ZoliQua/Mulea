name: python

on:
  push:
    branches: [master]
    paths: ['python/**', '.github/workflows/python.yaml']
  pull_request:
    paths: ['python/**', '.github/workflows/python.yaml']

# Least-privilege: this workflow only reads the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable, with dev extras)
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy src
      - name: Tests (incl. numerical parity vs the R fixtures)
        run: pytest
