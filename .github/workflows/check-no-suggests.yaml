# Workflow manually copied from: https://github.com/r-lib/actions/blob/v2-branch/examples/check-no-suggests.yaml
#
# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# NOTE: This workflow only directly installs "hard" dependencies, i.e. Depends,
# Imports, and LinkingTo dependencies. Notably, Suggests dependencies are never
# installed, with the exception of testthat, knitr, and rmarkdown. The cache is
# never used to avoid accidentally restoring a cache containing a suggested
# dependency.
# Only run for changes to the R package itself — this polyglot repo also holds python/ and
# web/ legs (each with their own CI), so a Python- or web-only push should not trigger this
# R CMD check.
on:
  push:
    branches: [main, master]
    paths: &r-paths
      - 'R/**'
      - 'src/**'
      - 'tests/**'
      - 'man/**'
      - 'vignettes/**'
      - 'inst/**'
      - 'data/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/check-no-suggests.yaml'
  pull_request:
    branches: [main, master]
    paths: *r-paths

name: R-CMD-check-hard

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    # This is a Linux-only check, so it shares the same exposure as the ubuntu legs of
    # the main R-CMD-check workflow: `pak` resolves the Bioconductor dependency (fgsea)
    # through the Bioconductor OSN host (mghp.osn.xsede.org), which has recurring outages
    # that break dependency resolution before R CMD check runs. That is upstream
    # infrastructure, not a package issue, so do not gate the board on it; the job still
    # runs and turns green again on its own once OSN recovers.
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      # The GitHub-hosted Ubuntu image ships Microsoft apt repositories that
      # intermittently return HTTP 403, breaking `apt-get update` inside setup-r.
      # We don't need them, so drop them before any apt operation runs.
      - name: Remove flaky Microsoft apt repositories (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/*microsoft* \
                     /etc/apt/sources.list.d/*azure* || true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          cache: false
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
